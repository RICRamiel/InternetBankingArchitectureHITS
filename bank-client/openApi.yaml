openapi: 3.0.1
info:
  title: Bank API
  version: "1.0"
servers:
  - url: http://localhost:8000/api
    description: Bank API Gateway
security:
  - JWT: []
paths:
  # User Service Endpoints
  /user-service/users/{id}/edit:
    put:
      tags:
        - Users
      operationId: editUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserEditModelDto'
        required: true
      responses:
        '200':
          description: OK
  /user-service/account/edit:
    put:
      tags:
        - Account
      operationId: editUser_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserEditModelDto'
        required: true
      responses:
        '200':
          description: OK
  /user-service/auth/revoke:
    post:
      tags:
        - Auth
      operationId: revoke
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshModelDto'
        required: true
      responses:
        '200':
          description: OK
  /user-service/auth/register:
    post:
      tags:
        - Auth
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterModelDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/JwtModelDto'
  /user-service/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshAndRotate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshModelDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/JwtModelDto'
  /user-service/auth/login:
    post:
      tags:
        - Auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginModelDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/JwtModelDto'
  /user-service/users/{id}:
    get:
      tags:
        - Users
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDto'
    delete:
      tags:
        - Users
      operationId: deleteUserById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /user-service/users/{id}/isActive:
    get:
      tags:
        - Users
      operationId: isUserActiveById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: boolean
  /user-service/internal/users/{id}:
    get:
      tags:
        - Users Internal
      operationId: getUserById_1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-API-KEY
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDto'
  /user-service/auth/validate:
    get:
      tags:
        - Auth
      operationId: isTokenValid
      responses:
        '200':
          description: OK
  /user-service/auth/oauth2/authorization/{providerId}:
    get:
      tags:
        - Auth
      operationId: initiateOAuth2Login
      parameters:
        - name: providerId
          in: path
          description: OAuth2 provider ID (google, github, etc.)
          required: true
          schema:
            type: string
          example: google
      responses:
        '200':
          description: OK
  /user-service/account:
    get:
      tags:
        - Account
      operationId: getUser
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserDto'
  # Core API Endpoints
  /core-api/transactions/withdraw:
    post:
      tags:
        - transaction-operation-controller
      operationId: withdrawMoney
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawDto'
        required: true
      responses:
        '200':
          description: OK
  /core-api/transactions/enroll:
    post:
      tags:
        - transaction-operation-controller
      operationId: enrollMoney
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollDto'
        required: true
      responses:
        '200':
          description: OK
  /core-api/cardaccount/open/{userId}:
    post:
      tags:
        - card-account-controller
      operationId: openAccount
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CardAccount'
  /core-api/cardaccount/close/{accountId}:
    post:
      tags:
        - card-account-controller
      operationId: closeAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: boolean
  /core-api/transactions/{accountId}:
    get:
      tags:
        - transaction-operation-controller
      operationId: getTransactionOperations
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pageIndex
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 30
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageTransactionOperation'
  /core-api/cardaccount/{accountId}:
    get:
      tags:
        - card-account-controller
      operationId: getUserCardAccount
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CardAccount'
  /core-api/cardaccount/exists/{accountId}:
    get:
      tags:
        - card-account-controller
      operationId: checkAccountExists
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: boolean
  /core-api/cardaccount/all/{userId}:
    get:
      tags:
        - card-account-controller
      operationId: getUserCardAccounts
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pageIndex
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 30
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageCardAccount'
  # Credit Service Endpoints
  /credit-service/credit_rule/{creditRuleId}/edit:
    put:
      tags:
        - credit-rule-controller
      operationId: editCreditRule
      parameters:
        - name: creditRuleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditRuleDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreditRule'
  /credit-service/credit_rule/create:
    post:
      tags:
        - credit-rule-controller
      operationId: createCreditRule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditRuleDTO'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreditRule'
  /credit-service/credit/{cardAccountId}/enrollment:
    post:
      tags:
        - credit-controller
      operationId: makeEnrollment
      parameters:
        - name: cardAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: money
          in: query
          required: true
          schema:
            type: number
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Credit'
  /credit-service/credit/create:
    post:
      tags:
        - credit-controller
      operationId: createCredit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCreateModelDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Credit'
  /credit-service/credit_rule/{creditRuleId}/get_by_id:
    get:
      tags:
        - credit-rule-controller
      operationId: getCreditRuleById
      parameters:
        - name: creditRuleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreditRule'
  /credit-service/credit_rule/get_all:
    get:
      tags:
        - credit-rule-controller
      operationId: getAllCreditRules
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditRule'
  /credit-service/credit/{userId}/get_by_user_id:
    get:
      tags:
        - credit-controller
      operationId: getByUserId
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Credit'
  /credit-service/credit/{cardAccountId}/get_by_card_account:
    get:
      tags:
        - credit-controller
      operationId: getByCardAccountId
      parameters:
        - name: cardAccountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Credit'
  /credit-service/credit_rule/{creditRuleId}/delete:
    delete:
      tags:
        - credit-rule-controller
      operationId: deleteCreditRule
      parameters:
        - name: creditRuleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /credit-service/credit/{creditId}/delete:
    delete:
      tags:
        - credit-controller
      operationId: deleteCredit
      parameters:
        - name: creditId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
components:
  schemas:
    # User Service Schemas
    UserEditModelDto:
      required:
        - name
      type: object
      properties:
        name:
          type: string
    TokenRefreshModelDto:
      required:
        - value
      type: object
      properties:
        value:
          type: string
    RegisterModelDto:
      required:
        - email
        - name
        - password
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          maxLength: 255
          minLength: 6
          type: string
    JwtModelDto:
      required:
        - accessToken
        - refreshToken
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
    LoginModelDto:
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
        password:
          maxLength: 255
          minLength: 6
          type: string
    UserDto:
      required:
        - email
        - id
        - name
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        roles:
          uniqueItems: true
          type: array
          items:
            type: string
            enum:
              - CLIENT
              - WORKER
              - BLOCKED_CLIENT
              - BLOCKED_WORKER
        active:
          type: boolean
    # Core API Schemas
    WithdrawDto:
      type: object
      properties:
        cardAccountId:
          type: string
          format: uuid
        sum:
          type: number
        destination:
          type: string
    EnrollDto:
      type: object
      properties:
        cardAccountId:
          type: string
          format: uuid
        sum:
          type: number
        destination:
          type: string
    CardAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        money:
          type: number
        deleted:
          type: boolean
        transactionOperations:
          type: array
          items:
            $ref: '#/components/schemas/TransactionOperation'
    TransactionOperation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        account:
          $ref: '#/components/schemas/CardAccount'
        dateTime:
          type: string
          format: date-time
        transactionType:
          type: string
          enum:
            - WITHDRAWAL
            - ENROLLMENT
        transactionStatus:
          type: string
          enum:
            - COMPLETE
            - IN_PROGRESS
            - DECLINED
        money:
          type: number
    PageTransactionOperation:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/TransactionOperation'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        pageable:
          $ref: '#/components/schemas/PageableObject'
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: '#/components/schemas/SortObject'
        paged:
          type: boolean
        unpaged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    PageCardAccount:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/CardAccount'
        number:
          type: integer
          format: int32
        sort:
          $ref: '#/components/schemas/SortObject'
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        pageable:
          $ref: '#/components/schemas/PageableObject'
        empty:
          type: boolean
    # Credit Service Schemas
    CreditRuleDTO:
      type: object
      properties:
        percentageStrategy:
          type: string
          enum:
            - FROM_REMAINING_DEBT
            - FROM_TOTAL_DEBT
        collectionPeriodSeconds:
          type: integer
          format: int32
        openingDate:
          type: string
          format: date-time
        ruleName:
          type: string
        percentage:
          type: number
    CreditRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        percentageStrategy:
          type: string
          enum:
            - FROM_REMAINING_DEBT
            - FROM_TOTAL_DEBT
        collectionPeriodSeconds:
          type: integer
          format: int32
        openingDate:
          type: string
          format: date-time
        ruleName:
          type: string
        percentage:
          type: number
    Credit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        cardAccount:
          type: string
          format: uuid
        lastInterestUpdate:
          type: string
          format: date-time
        currentDebtSum:
          type: numder
        initialDebt:
          type: number
        interestDebtSum:
          type: numder
        creditRule:
          $ref: '#/components/schemas/CreditRule'
    CreditCreateModelDto:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        cardAccount:
          type: string
          format: uuid
        totalDebt:
          type: number
        creditRuleId:
          type: string
          format: uuid
  securitySchemes:
    JWT:
      type: http
      name: JWT
      scheme: bearer
      bearerFormat: JWT
