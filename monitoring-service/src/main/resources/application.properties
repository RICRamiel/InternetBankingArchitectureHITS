spring.application.name=monitoring-service
spring.kafka.consumer.group-id=monitoring-group
spring.datasource.url=jdbc:postgresql://localhost:5433/monitoring_db
spring.datasource.username=admin
spring.datasource.password=password
server.port=${SERVER_PORT:8008}

spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=org.postgresql.Driver
spring.kafka.bootstrap-servers=${KAFKA_SERVER_IP_PORT:127.0.0.1:9092}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.ricramiel.common.dtos

server.servlet.context-path=/api/monitoring-service