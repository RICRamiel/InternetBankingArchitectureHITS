events {
    worker_connections 1024;
}

http{
    server {
        # Слушаем 80 порт на всех сетевых интерфейсах контейнера
        listen 80;
        # Можно слушать и на IPv6
        listen [::]:80;

        # Имя сервера - то, что приходит в Host заголовке
        server_name worker.thallassianangel.su;

        # Настройки логов для этого server блока
        access_log /var/log/nginx/project1_access.log;
        error_log /var/log/nginx/project1_error.log;

        # Максимальный размер тела запроса (полезно для загрузки файлов)
        client_max_body_size 5M;

        # Основная локация - обрабатывает все запросы
        location / {
            # Проксирование на внутренний сервис project1
            # Имя "project1" резолвится через внутренний DNS Docker в IP контейнера
            # Порт 5174 - тот, что указан в expose у сервиса project1
            proxy_pass http://worker:5174;

            # --- Важные заголовки для правильной работы приложения ---

            # Передаем оригинальный Host (нужно для генерации абсолютных ссылок)
            proxy_set_header Host $host;

            # Передаем реальный IP посетителя
            proxy_set_header X-Real-IP $remote_addr;

            # Передаем цепочку IP (если за прокси стоит еще прокси)
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Передаем протокол (http/https) оригинального запроса
            proxy_set_header X-Forwarded-Proto $scheme;

            # Передаем порт оригинального запроса
            proxy_set_header X-Forwarded-Port $server_port;

            # --- Настройки для WebSocket (если используется, например, Vite) ---
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # --- Таймауты (важно для долгих запросов) ---
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # --- Буферизация ответа ---
            proxy_buffering off;  # Отключаем для SSE/WebSocket
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Опционально: специальная локация для статики (если nginx будет раздавать сам)
        location /static/ {
            alias /usr/share/nginx/html/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Опционально: скрыть версию nginx для безопасности
        server_tokens off;
    }

    # Блок server для project2.example.com (аналогично)
    server {
        listen 80;
        listen [::]:80;
        server_name client.thallassianangel.su;

        access_log /var/log/nginx/project2_access.log;
        error_log /var/log/nginx/project2_error.log;

        client_max_body_size 5M;

        location / {
            proxy_pass http://client:5173;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket поддержка
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        server_tokens off;
    }

    # Опционально: дефолтный server блок для отлова всех неопознанных запросов
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;  # Любое имя

        # Возвращаем 404 для всех неизвестных доменов
        return 444;  # 444 - nginx специальный код "connection closed without response"

        access_log off;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name api.thallassianangel.su;

        access_log /var/log/nginx/api_access.log;
        error_log /var/log/nginx/api_error.log;

        client_max_body_size 10M;

        location / {

            proxy_pass http://api-gateway:8080;

            # Важные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # WebSocket (если вдруг используешь)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering off;
        }

        server_tokens off;
    }
}