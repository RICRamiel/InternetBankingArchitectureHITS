events {
    worker_connections 1024;
}

http {
    server_tokens off;

    ssl_certificate /etc/nginx/ssl/wildcard.thallassianangel.su.crt;
    ssl_certificate_key /etc/nginx/ssl/wildcard.thallassianangel.su.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # The public TLS certificate is terminated by the external reverse proxy.
    # Preserve its forwarded proto/port so apps behind this nginx still see HTTPS.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_x_forwarded_port $forwarded_port {
        default $http_x_forwarded_port;
        "" $server_port;
    }

    upstream worker_app {
        server worker:5174;
    }

    upstream client_app {
        server client:5173;
    }

    upstream sso_app {
        server sso:5175;
    }

    upstream bff_app {
        server bff:8000;
    }

    upstream api_gateway {
        server api-gateway:8080;
    }

    upstream grafana_app {
        server grafana:3000;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_buffering off;

    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name worker.thallassianangel.su;

        access_log /var/log/nginx/worker_access.log;
        error_log /var/log/nginx/worker_error.log;

        client_max_body_size 10M;

        location = /metrics {
            return 301 /metrics/;
        }

        location /metrics/ {
            proxy_pass http://grafana_app;
        }

        location /api/ {
            proxy_pass http://bff_app;
        }


        location / {
            proxy_pass http://worker_app;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name client.thallassianangel.su;

        access_log /var/log/nginx/client_access.log;
        error_log /var/log/nginx/client_error.log;

        client_max_body_size 10M;

        location /api/ {
            proxy_pass http://bff_app;
        }

        location / {
            proxy_pass http://client_app;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name sso.thallassianangel.su;

        access_log /var/log/nginx/sso_access.log;
        error_log /var/log/nginx/sso_error.log;

        client_max_body_size 10M;

        location /api/ {
            proxy_pass http://bff_app;
        }

        location / {
            proxy_pass http://sso_app;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name bff.thallassianangel.su;

        access_log /var/log/nginx/bff_access.log;
        error_log /var/log/nginx/bff_error.log;

        client_max_body_size 10M;

        location / {
            proxy_pass http://bff_app;
        }
    }

    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name api.thallassianangel.su;

        access_log /var/log/nginx/api_access.log;
        error_log /var/log/nginx/api_error.log;

        client_max_body_size 10M;

        location / {
            proxy_pass http://api_gateway;
        }
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        access_log off;
        return 444;
    }
}
